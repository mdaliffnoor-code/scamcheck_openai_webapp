{% extends "base.html" %}
{% block title %}Login | ScamCheck{% endblock %}

{% block content %}
<section class="page-section">
    <div class="shell narrow">
        <div class="auth-card">

            <p class="eyebrow">ACCOUNT</p>
            <h1>Login</h1>

            <form
                class="auth-form"
                method="POST"
                action="{{ url_for('login') }}"
            >

                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="username"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="muted">
                Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
            </p>

        </div>
    </div>
</section>
{% endblock %}
