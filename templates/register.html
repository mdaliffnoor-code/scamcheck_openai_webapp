{% extends "base.html" %}
{% block title %}Register | ScamCheck{% endblock %}

{% block content %}
<section class="page-section">
    <div class="shell narrow">
        <div class="auth-card">

            <p class="eyebrow">NEW ACCOUNT</p>
            <h1>Register</h1>

            <form
                class="auth-form"
                method="POST"
                action="{{ url_for('register') }}"
            >

                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="username"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="muted">
                Already have an account?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>

        </div>
    </div>
</section>
{% endblock %}
